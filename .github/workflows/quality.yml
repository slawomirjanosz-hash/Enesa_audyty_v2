name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, zip, sqlite3
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test table sorting
        run: npm run test:tables

      - name: Test questionnaire navigation
        run: npm run test:questionnaires

      - name: Check PHP code style
        run: composer format:test

      - name: Run static analysis
        run: composer analyse

      - name: Run tests
        run: composer test

      - name: Install presentation converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fonts-liberation fonts-crosextra-carlito

      - name: Test real PowerPoint conversion
        run: php artisan test --filter="real server converter"

      - name: Audit dependencies
        run: |
          composer audit --locked
          npm audit --audit-level=low
