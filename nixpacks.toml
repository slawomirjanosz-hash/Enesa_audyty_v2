[phases.setup]
aptPkgs = ['...', 'libreoffice-impress', 'poppler-utils', 'fonts-liberation', 'fonts-crosextra-carlito']

[phases.install]
cmds = [
  'composer install --no-dev --classmap-authoritative --no-interaction',
  'npm ci'
]

[phases.build]
cmds = [
  'npm run build',
  'php artisan config:cache',
  'php artisan route:cache',
  'php artisan view:cache'
]

[start]
cmd = 'php artisan storage:link --force && php artisan migrate --force && PHP_INI_SCAN_DIR="${PHP_INI_SCAN_DIR:-}:/app/deploy/php" php artisan serve --no-reload --host=0.0.0.0 --port=${PORT:-8000}'
